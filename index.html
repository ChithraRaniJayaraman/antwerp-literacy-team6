<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhancing Reading Literacy</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #f3efe8;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      background: url('hero-library.jpg') center center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.10);
      z-index: 1;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.08),
        rgba(0,0,0,0.12)
      );
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 4;
      max-width: 1200px;
      padding: 30px 24px;
    }

    .hero h1 {
      color: #ffffff;
      font-size: 5.2rem;
      font-weight: 700;
      line-height: 1.05;
      margin-bottom: 26px;
      text-shadow: 0 8px 28px rgba(0,0,0,0.28);
      opacity: 0;
      transform: scale(0.6) translateY(60px);
      animation: popBounce 1.35s ease forwards;
    }

    .hero-subtitle {
      color: rgba(255,255,255,0.98);
      font-size: 1.6rem;
      margin-bottom: 32px;
      text-shadow: 0 4px 16px rgba(0,0,0,0.18);
      opacity: 0;
      transform: translateY(28px);
      animation: fadeUp 1s ease forwards;
      animation-delay: 0.45s;
    }

    .hero-tag {
      display: inline-block;
      background: rgba(62, 56, 48, 0.78);
      color: #ffffff;
      padding: 18px 30px;
      border-radius: 18px;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      line-height: 1.7;
      box-shadow: 0 12px 30px rgba(0,0,0,0.22);
      backdrop-filter: blur(4px);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s ease forwards;
      animation-delay: 0.85s;
    }

    /* BIGGER SHINING DOTS */
    .dot {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0.92) 45%, rgba(255,255,255,0.3) 100%);
      box-shadow:
        0 0 14px rgba(255,255,255,0.95),
        0 0 28px rgba(255,255,255,0.75),
        0 0 48px rgba(255,255,255,0.45);
      z-index: 3;
      animation: pulseBright 2.8s ease-in-out infinite;
    }

    .dot1 { top: 18%; left: 17%; animation-delay: 0s; }
    .dot2 { top: 30%; right: 15%; animation-delay: 0.8s; }
    .dot3 { bottom: 21%; left: 22%; animation-delay: 1.5s; }
    .dot4 { bottom: 25%; right: 10%; animation-delay: 2.1s; }

    /* CROSSING MAP LINES */
    .line {
      position: absolute;
      height: 3px;
      background: linear-gradient(
        to right,
        rgba(255,255,255,0.12),
        rgba(255,255,255,0.95),
        rgba(255,255,255,0.12)
      );
      border-radius: 999px;
      z-index: 2;
      box-shadow: 0 0 18px rgba(255,255,255,0.45);
      animation: glowLine 3.2s ease-in-out infinite;
    }

    .line1 {
      top: 21%;
      left: 18%;
      width: 320px;
      transform: rotate(18deg);
    }

    .line2 {
      top: 33%;
      right: 16%;
      width: 240px;
      transform: rotate(-22deg);
    }

    .line3 {
      bottom: 22%;
      left: 23%;
      width: 300px;
      transform: rotate(-15deg);
    }

    .line4 {
      bottom: 27%;
      right: 11%;
      width: 220px;
      transform: rotate(24deg);
    }

    /* SPARKLES */
    .spark {
      position: absolute;
      color: rgba(255,255,255,0.98);
      font-size: 1.7rem;
      z-index: 3;
      text-shadow:
        0 0 8px rgba(255,255,255,0.95),
        0 0 18px rgba(255,255,255,0.7),
        0 0 28px rgba(255,255,255,0.45);
      animation: twinkle 2.2s ease-in-out infinite;
    }

    .spark1 { top: 14%; left: 47%; animation-delay: 0.2s; }
    .spark2 { top: 56%; left: 10%; animation-delay: 1s; }
    .spark3 { bottom: 18%; left: 52%; animation-delay: 1.6s; }
    .spark4 { bottom: 30%; right: 22%; animation-delay: 0.8s; }

    @keyframes popBounce {
      0% {
        opacity: 0;
        transform: scale(0.6) translateY(60px);
      }
      60% {
        opacity: 1;
        transform: scale(1.08) translateY(-10px);
      }
      80% {
        transform: scale(0.96) translateY(5px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseBright {
      0%, 100% {
        transform: scale(1);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.35);
        opacity: 1;
      }
    }

    @keyframes glowLine {
      0%, 100% {
        opacity: 0.38;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.35;
        transform: scale(0.9) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: scale(1.28) rotate(10deg);
      }
    }

    @media (max-width: 1100px) {
      .hero h1 {
        font-size: 4.2rem;
      }

      .hero-subtitle {
        font-size: 1.3rem;
      }
    }

    @media (max-width: 768px) {
      .hero {
        padding: 20px;
      }

      .hero h1 {
        font-size: 2.7rem;
      }

      .hero-subtitle {
        font-size: 1.05rem;
        margin-bottom: 24px;
      }

      .hero-tag {
        font-size: 1rem;
        padding: 14px 18px;
      }

      .dot {
        width: 14px;
        height: 14px;
      }

      .line {
        display: none;
      }

      .spark {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="dot dot1"></div>
    <div class="dot dot2"></div>
    <div class="dot dot3"></div>
    <div class="dot dot4"></div>

    <div class="line line1"></div>
    <div class="line line2"></div>
    <div class="line line3"></div>
    <div class="line line4"></div>

    <div class="spark spark1">✦</div>
    <div class="spark spark2">✦</div>
    <div class="spark spark3">✦</div>
    <div class="spark spark4">✦</div>

    <div class="hero-content">
      <h1>
        [Enhancing Reading Literacy<br>
        in Flemish Secondary<br>
        Schools]
      </h1>

      <div class="hero-subtitle">
        School Improvement Studies • Antwerpen 2026
      </div>

      <div class="hero-tag">
        Literacy Spark 6<br>
        Rana • Lingyan • Chitra • Mariana
      </div>
    </div>
  </section>

</body>
</html>
