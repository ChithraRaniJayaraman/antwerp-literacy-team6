<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enhancing Reading Literacy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f3efe8;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      background: #f3efe8;
    }

    .hero-text {
      position: relative;
      background: linear-gradient(to right, #f4f1eb 0%, #f2eee7 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 70px 60px 85px;
      overflow: hidden;
    }

    .hero-text h1 {
      color: #8a7f64;
      font-size: 5rem;
      line-height: 0.98;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      max-width: 620px;
      position: relative;
      z-index: 3;
      opacity: 0;
      transform: translateY(40px);
      animation: fadeUp 1.4s ease forwards;
    }

    .hero-subtitle {
      margin-top: 55px;
      color: #8a7f64;
      font-size: 3rem;
      line-height: 1;
      font-weight: 400;
      text-transform: uppercase;
      position: relative;
      z-index: 3;
      opacity: 0;
      transform: translateY(25px);
      animation: fadeUp 1.4s ease forwards;
      animation-delay: 0.6s;
    }

    .hero-line {
      margin-top: 22px;
      width: 180px;
      height: 5px;
      background: #8a7f64;
      position: relative;
      z-index: 3;
      opacity: 0;
      transform: scaleX(0);
      transform-origin: left;
      animation: lineGrow 1s ease forwards;
      animation-delay: 1s;
    }

    .hero-tag {
      margin-top: 35px;
      display: inline-block;
      width: fit-content;
      padding: 12px 22px;
      border: 1.5px solid rgba(138, 127, 100, 0.45);
      color: #7c7157;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(2px);
      position: relative;
      z-index: 3;
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 1.2s ease forwards;
      animation-delay: 1.2s;
    }

    .hero-image {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Decorative animation layer */
    .decor {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #b8a98a;
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(184, 169, 138, 0.7);
      animation: pulseDot 3s ease-in-out infinite;
    }

    .dot1 { top: 13%; left: 12%; animation-delay: 0s; }
    .dot2 { top: 23%; left: 42%; animation-delay: 0.8s; }
    .dot3 { top: 58%; left: 18%; animation-delay: 1.4s; }
    .dot4 { top: 72%; left: 48%; animation-delay: 2s; }
    .dot5 { top: 82%; left: 28%; animation-delay: 2.6s; }

    .line {
      position: absolute;
      height: 2px;
      background: rgba(170, 156, 126, 0.45);
      transform-origin: left center;
      animation: glowLine 4s ease-in-out infinite;
    }

    .line1 {
      top: 16%;
      left: 13%;
      width: 170px;
      transform: rotate(18deg);
    }

    .line2 {
      top: 60%;
      left: 19%;
      width: 210px;
      transform: rotate(-12deg);
    }

    .line3 {
      top: 76%;
      left: 30%;
      width: 130px;
      transform: rotate(-28deg);
    }

    .star {
      position: absolute;
      color: rgba(158, 144, 116, 0.8);
      font-size: 1.1rem;
      animation: twinkle 2.8s ease-in-out infinite;
    }

    .star1 { top: 10%; left: 32%; animation-delay: 0.3s; }
    .star2 { top: 38%; left: 10%; animation-delay: 1.1s; }
    .star3 { top: 66%; left: 40%; animation-delay: 1.8s; }
    .star4 { top: 86%; left: 15%; animation-delay: 0.9s; }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes lineGrow {
      to {
        opacity: 1;
        transform: scaleX(1);
      }
    }

    @keyframes pulseDot {
      0%, 100% {
        transform: scale(1);
        opacity: 0.65;
      }
      50% {
        transform: scale(1.45);
        opacity: 1;
      }
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.3;
        transform: scale(0.9) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: scale(1.2) rotate(12deg);
      }
    }

    @keyframes glowLine {
      0%, 100% {
        opacity: 0.25;
      }
      50% {
        opacity: 0.8;
      }
    }

    @media (max-width: 1200px) {
      .hero-text h1 {
        font-size: 4.2rem;
      }

      .hero-subtitle {
        font-size: 2.5rem;
      }
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .hero-image {
        min-height: 42vh;
        order: 1;
      }

      .hero-text {
        order: 2;
        padding: 40px 28px 50px;
      }

      .hero-text h1 {
        font-size: 2.7rem;
        max-width: 100%;
      }

      .hero-subtitle {
        font-size: 2rem;
        margin-top: 35px;
      }

      .hero-line {
        width: 120px;
      }

      .hero-tag {
        font-size: 0.95rem;
        padding: 10px 18px;
      }

      .dot, .line, .star {
        opacity: 0.75;
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero-text">
      <div class="decor">
        <div class="dot dot1"></div>
        <div class="dot dot2"></div>
        <div class="dot dot3"></div>
        <div class="dot dot4"></div>
        <div class="dot dot5"></div>

        <div class="line line1"></div>
        <div class="line line2"></div>
        <div class="line line3"></div>

        <div class="star star1">✦</div>
        <div class="star star2">✦</div>
        <div class="star star3">✦</div>
        <div class="star star4">✦</div>
      </div>

      <h1>
        [Enhancing<br>
        Reading<br>
        Literacy in<br>
        Flemish<br>
        Secondary<br>
        Schools]
      </h1>

      <div class="hero-subtitle">
        [Antwerpen-<br>
        2026]
      </div>

      <div class="hero-line"></div>

      <div class="hero-tag">Literacy Spark 6</div>
    </div>

    <div class="hero-image">
      <img src="hero-library.jpg" alt="Library and study space">
    </div>
  </section>

</body>
</html>
