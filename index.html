<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhancing Reading Literacy</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #f3efe8;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      background: url('hero-library.jpg') center center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    /* very light overlay only */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.03);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 5;
      max-width: 1200px;
      padding: 30px 24px;
    }

    .hero h1 {
      color: #fdfaf2;
      font-size: 5.6rem;
      font-weight: 700;
      line-height: 1.04;
      margin-bottom: 28px;
      opacity: 1;
      transform: scale(1) translateY(0);
      animation: popBounce 1.35s ease forwards;
      text-shadow:
        0 3px 8px rgba(0,0,0,0.22),
        0 8px 24px rgba(0,0,0,0.18),
        0 0 2px rgba(0,0,0,0.25);
    }

    .hero-subtitle {
      color: #fffdf8;
      font-size: 1.7rem;
      margin-bottom: 34px;
      text-shadow:
        0 3px 10px rgba(0,0,0,0.16),
        0 0 2px rgba(0,0,0,0.18);
      opacity: 1;
      animation: fadeUp 1s ease forwards;
      animation-delay: 0.35s;
    }

    .hero-tag {
      display: inline-block;
      background: rgba(78, 66, 52, 0.76);
      color: #ffffff;
      padding: 20px 34px;
      border-radius: 18px;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1.65;
      box-shadow:
        0 12px 30px rgba(0,0,0,0.2),
        0 0 18px rgba(255,255,255,0.08);
      backdrop-filter: blur(4px);
      opacity: 1;
      animation: fadeUp 1s ease forwards;
      animation-delay: 0.7s;
    }

    /* bigger brighter dots */
    .dot {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #ffffff 45%, rgba(255,255,255,0.35) 100%);
      box-shadow:
        0 0 12px rgba(255,255,255,0.95),
        0 0 28px rgba(255,255,255,0.9),
        0 0 56px rgba(255,255,255,0.6);
      z-index: 3;
      animation: pulseBright 2.6s ease-in-out infinite;
    }

    .dot1 { top: 18%; left: 14%; animation-delay: 0s; }
    .dot2 { top: 31%; right: 15%; animation-delay: 0.8s; }
    .dot3 { bottom: 20%; left: 22%; animation-delay: 1.4s; }
    .dot4 { bottom: 25%; right: 9%; animation-delay: 2s; }

    .line {
      position: absolute;
      height: 4px;
      border-radius: 999px;
      z-index: 2;
      background: linear-gradient(
        to right,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.98),
        rgba(255,255,255,0.08)
      );
      box-shadow: 0 0 22px rgba(255,255,255,0.45);
      animation: glowLine 3s ease-in-out infinite;
    }

    .line1 {
      top: 21%;
      left: 15%;
      width: 360px;
      transform: rotate(18deg);
    }

    .line2 {
      top: 34%;
      right: 15%;
      width: 250px;
      transform: rotate(-24deg);
    }

    .line3 {
      bottom: 22%;
      left: 23%;
      width: 320px;
      transform: rotate(-16deg);
    }

    .line4 {
      bottom: 27%;
      right: 10%;
      width: 230px;
      transform: rotate(22deg);
    }

    .spark {
      position: absolute;
      color: rgba(255,255,255,0.98);
      font-size: 2rem;
      z-index: 4;
      text-shadow:
        0 0 10px rgba(255,255,255,1),
        0 0 22px rgba(255,255,255,0.85),
        0 0 36px rgba(255,255,255,0.5);
      animation: twinkle 2.2s ease-in-out infinite;
    }

    .spark1 { top: 13%; left: 48%; animation-delay: 0.2s; }
    .spark2 { top: 55%; left: 8%; animation-delay: 0.9s; }
    .spark3 { bottom: 16%; left: 50%; animation-delay: 1.5s; }
    .spark4 { bottom: 30%; right: 21%; animation-delay: 0.7s; }

    @keyframes popBounce {
      0% {
        opacity: 0;
        transform: scale(0.72) translateY(60px);
      }
      60% {
        opacity: 1;
        transform: scale(1.08) translateY(-10px);
      }
      80% {
        transform: scale(0.97) translateY(5px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(26px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseBright {
      0%, 100% {
        transform: scale(1);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.38);
        opacity: 1;
      }
    }

    @keyframes glowLine {
      0%, 100% {
        opacity: 0.45;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.4;
        transform: scale(0.92) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: scale(1.3) rotate(10deg);
      }
    }

    @media (max-width: 1100px) {
      .hero h1 {
        font-size: 4.5rem;
      }

      .hero-subtitle {
        font-size: 1.35rem;
      }

      .hero-tag {
        font-size: 1.2rem;
      }
    }

    @media (max-width: 768px) {
      .hero {
        padding: 20px;
      }

      .hero h1 {
        font-size: 2.9rem;
      }

      .hero-subtitle {
        font-size: 1.08rem;
        margin-bottom: 24px;
      }

      .hero-tag {
        font-size: 1.02rem;
        padding: 14px 18px;
      }

      .dot {
        width: 18px;
        height: 18px;
      }

      .line {
        display: none;
      }

      .spark {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="dot dot1"></div>
    <div class="dot dot2"></div>
    <div class="dot dot3"></div>
    <div class="dot dot4"></div>

    <div class="line line1"></div>
    <div class="line line2"></div>
    <div class="line line3"></div>
    <div class="line line4"></div>

    <div class="spark spark1">✦</div>
    <div class="spark spark2">✦</div>
    <div class="spark spark3">✦</div>
    <div class="spark spark4">✦</div>

    <div class="hero-content">
      <h1>
        [Enhancing Reading Literacy<br>
        in Flemish Secondary<br>
        Schools]
      </h1>

      <div class="hero-subtitle">
        School Improvement Studies • Antwerpen 2026
      </div>

      <div class="hero-tag">
        Literacy Spark 6<br>
        Rana • Lingyan • Chitra • Mariana
      </div>
    </div>
  </section>

</body>
</html>
