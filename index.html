<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enhancing Reading Literacy</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  background: #f3efe8;
}

/* HERO SECTION */
.hero {
  position: relative;
  min-height: 100vh;
  background: url('hero-library.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
}

/* overlay for readability */
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.25);
}

/* CONTENT */
.hero-content {
  position: relative;
  z-index: 2;
  max-width: 1100px;
  padding: 20px;
}

/* HEADING POP ANIMATION */
.hero h1 {
  color: white;
  font-size: 5rem;
  font-weight: 700;
  line-height: 1.05;
  margin-bottom: 25px;
  text-shadow: 0 8px 25px rgba(0,0,0,0.3);

  opacity: 0;
  transform: scale(0.6) translateY(60px);
  animation: popBounce 1.4s ease forwards;
}

/* SUBTITLE */
.hero-subtitle {
  color: rgba(255,255,255,0.95);
  font-size: 1.6rem;
  margin-bottom: 30px;

  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 1s ease forwards;
  animation-delay: 0.5s;
}

/* TEAM BOX */
.hero-tag {
  display: inline-block;
  background: rgba(60,55,50,0.8);
  color: white;
  padding: 16px 28px;
  border-radius: 18px;
  font-family: Arial, sans-serif;
  font-weight: bold;
  font-size: 1.2rem;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);

  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1s ease forwards;
  animation-delay: 0.9s;
}

/* DOTS */
.dot {
  position: absolute;
  width: 14px;
  height: 14px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 20px white;
  animation: pulse 3s infinite;
}

.dot1 { top: 20%; left: 15%; }
.dot2 { top: 30%; right: 20%; }
.dot3 { bottom: 20%; left: 20%; }
.dot4 { bottom: 25%; right: 15%; }

/* LINES */
.line {
  position: absolute;
  height: 2px;
  background: rgba(255,255,255,0.6);
  animation: glow 3s infinite;
}

.line1 {
  top: 22%;
  left: 16%;
  width: 180px;
  transform: rotate(15deg);
}

.line2 {
  bottom: 22%;
  left: 22%;
  width: 200px;
  transform: rotate(-10deg);
}

/* ANIMATIONS */

@keyframes popBounce {
  0% {
    opacity: 0;
    transform: scale(0.6) translateY(60px);
  }
  60% {
    opacity: 1;
    transform: scale(1.1) translateY(-10px);
  }
  80% {
    transform: scale(0.95) translateY(5px);
  }
  100% {
    transform: scale(1) translateY(0);
  }
}

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes pulse {
  0%,100% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.4); opacity: 1; }
}

@keyframes glow {
  0%,100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .hero h1 {
    font-size: 2.6rem;
  }

  .hero-subtitle {
    font-size: 1.1rem;
  }

  .hero-tag {
    font-size: 1rem;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="dot dot1"></div>
  <div class="dot dot2"></div>
  <div class="dot dot3"></div>
  <div class="dot dot4"></div>

  <div class="line line1"></div>
  <div class="line line2"></div>

  <div class="hero-content">
    <h1>
      Enhancing Reading Literacy<br>
      in Flemish Secondary Schools
    </h1>

    <div class="hero-subtitle">
      School Improvement Studies • Antwerpen 2026
    </div>

    <div class="hero-tag">
      Literacy Spark 6<br>
      Rana • Lingyan • Chitra • Mariana
    </div>
  </div>

</section>

</body>
</html>
