<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enhancing Reading Literacy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f2f0ec;
      font-family: Georgia, "Times New Roman", serif;
    }

    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      background: #f2f0ec;
    }

    .hero-text {
      background: rgba(242, 240, 236, 0.96);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 70px 60px 80px;
    }

    .hero-text h1 {
      color: #8a8166;
      font-size: 5.1rem;
      line-height: 0.98;
      font-weight: 400;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      max-width: 620px;
    }

    .hero-subtitle {
      margin-top: 70px;
      color: #8a8166;
      font-size: 3.3rem;
      line-height: 1;
      font-weight: 400;
      text-transform: uppercase;
    }

    .hero-line {
      margin-top: 26px;
      width: 190px;
      height: 5px;
      background: #8a8166;
    }

    .hero-image {
      position: relative;
      overflow: hidden;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      filter: none;
    }

    @media (max-width: 1200px) {
      .hero-text h1 {
        font-size: 4.2rem;
      }

      .hero-subtitle {
        font-size: 2.8rem;
      }
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .hero-text {
        order: 2;
        padding: 40px 28px;
      }

      .hero-image {
        order: 1;
        min-height: 45vh;
      }

      .hero-text h1 {
        font-size: 2.8rem;
        max-width: 100%;
      }

      .hero-subtitle {
        margin-top: 40px;
        font-size: 2.1rem;
      }

      .hero-line {
        width: 120px;
        height: 4px;
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero-text">
      <h1>
        [Enhancing<br>
        Reading<br>
        Literacy in<br>
        Flemish<br>
        Secondary<br>
        Schools]
      </h1>

      <div class="hero-subtitle">
        [Antwerpen-<br>
        2026]
      </div>

      <div class="hero-line"></div>
    </div>

    <div class="hero-image">
      <img src="hero-library.jpg" alt="Library and study space">
    </div>
  </section>

</body>
</html>
