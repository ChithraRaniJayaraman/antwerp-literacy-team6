<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enhancing Reading Literacy</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  overflow-x: hidden;
}

/* HERO */
.hero {
  position: relative;
  min-height: 100vh;
  background: url('hero-library.jpg?v=2') center center / cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

/* LIGHT OVERLAY */
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.03);
}

/* CONTENT */
.hero-content {
  position: relative;
  z-index: 5;
  max-width: 1200px;
  padding: 20px;
}

/* TITLE */
.hero h1 {
  color: #ffffff;
  font-size: 7rem;
  line-height: 1.05;
  margin-bottom: 25px;

  text-shadow:
    0 6px 14px rgba(0,0,0,0.25),
    0 12px 40px rgba(0,0,0,0.25);

  animation: popBounce 1.2s ease forwards;
}

/* 🔥 SUBTITLE FIXED BIG */
.hero-subtitle {
  color: #ffffff !important;
  font-size: 3rem !important;
  font-weight: 700 !important;
  letter-spacing: 1px;
  margin-bottom: 35px;

  text-shadow:
    0 5px 12px rgba(0,0,0,0.35),
    0 10px 25px rgba(0,0,0,0.3);

  animation: fadeUp 1s ease forwards;
}

/* TEAM BOX */
.hero-tag {
  display: inline-block;
  background: rgba(60,55,50,0.82);
  color: white;
  padding: 22px 36px;
  border-radius: 18px;
  font-family: Arial, sans-serif;
  font-weight: bold;
  font-size: 1.6rem;
  box-shadow: 0 14px 35px rgba(0,0,0,0.3);
  animation: fadeUp 1s ease forwards;
}

/* DOTS */
.dot {
  position: absolute;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: white;
  box-shadow:
    0 0 20px white,
    0 0 40px white,
    0 0 80px white;
  animation: pulse 2.5s infinite;
}

.dot1 { top: 18%; left: 14%; }
.dot2 { top: 30%; right: 14%; }
.dot3 { bottom: 20%; left: 20%; }
.dot4 { bottom: 25%; right: 10%; }

/* LINES */
.line {
  position: absolute;
  height: 4px;
  background: linear-gradient(to right, transparent, white, transparent);
  box-shadow: 0 0 25px white;
  animation: glow 3s infinite;
}

.line1 {
  top: 22%;
  left: 15%;
  width: 350px;
  transform: rotate(18deg);
}

.line2 {
  top: 34%;
  right: 15%;
  width: 260px;
  transform: rotate(-22deg);
}

.line3 {
  bottom: 22%;
  left: 22%;
  width: 300px;
  transform: rotate(-15deg);
}

/* SPARKLES */
.spark {
  position: absolute;
  font-size: 2.2rem;
  color: white;
  text-shadow: 0 0 12px white, 0 0 30px white;
  animation: twinkle 2s infinite;
}

.spark1 { top: 14%; left: 50%; }
.spark2 { bottom: 20%; left: 45%; }
.spark3 { bottom: 28%; right: 20%; }

/* ANIMATIONS */
@keyframes popBounce {
  0% { transform: scale(0.7) translateY(50px); opacity: 0; }
  60% { transform: scale(1.1) translateY(-10px); opacity: 1; }
  100% { transform: scale(1); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.4); }
}

@keyframes glow {
  0%,100% { opacity: 0.4; }
  50% { opacity: 1; }
}

@keyframes twinkle {
  0%,100% { opacity: 0.4; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.3); }
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .hero h1 {
    font-size: 2.8rem;
  }

  .hero-subtitle {
    font-size: 1.6rem;
  }

  .hero-tag {
    font-size: 1rem;
  }

  .line {
    display: none;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="dot dot1"></div>
  <div class="dot dot2"></div>
  <div class="dot dot3"></div>
  <div class="dot dot4"></div>

  <div class="line line1"></div>
  <div class="line line2"></div>
  <div class="line line3"></div>

  <div class="spark spark1">✦</div>
  <div class="spark spark2">✦</div>
  <div class="spark spark3">✦</div>

  <div class="hero-content">
    <h1>
      Enhancing Reading Literacy<br>
      in Flemish Secondary Schools
    </h1>

    <div class="hero-subtitle">
      ANTWERPEN 2026
    </div>

    <div class="hero-tag">
      Literacy Spark 6<br>
      Rana • Lingyan • Chitra • Mariana
    </div>
  </div>

</section>

</body>
</html>
